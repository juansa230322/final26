  <!-- Google Fonts: Plus Jakarta Sans -->

  <!-- FontAwesome Icons CDN -->

  <!-- React 18, ReactDOM, Babel para ejecución en el navegador -->

  <!-- Confetti CDN para celebraciones de insignias y donaciones -->

  <!-- Supabase JS Client CDN (BaaS y Persistencia en la Nube) -->

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #051329;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .ocean-glass {
      background: rgba(11, 37, 69, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 180, 216, 0.25);
    }
    .ocean-glass-card {
      background: rgba(11, 37, 69, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(144, 224, 239, 0.15);
      transition: all 0.25s ease-in-out;
    }
    .ocean-glass-card:hover {
      border-color: rgba(0, 245, 212, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -5px rgba(0, 180, 216, 0.2);
    }
    .ocean-gradient-text {
      background: linear-gradient(135deg, #ffffff 10%, #90e0ef 50%, #00f5d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #07192f;
    }
    ::-webkit-scrollbar-thumb {
      background: #134074;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00b4d8;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.85); }
    }
    .pulse-emergency {
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>

<body class="selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <!-- Aplicación React 18 que consume limpiamente la Arquitectura POO -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_ASSETS = {
      logo: 'assets/logo_vida_marina.jpg',
      coral1: 'assets/arrecife_coral_1.png',
      fishes2: 'assets/peces_arrecife_2.png',
      ecosystem3: 'assets/ecosistema_marino_3.png'
    };

    const MONTH_NAMES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    function App() {
      // Instancia del controlador principal PlatformManager
      const manager = useMemo(() => {
        return new PlatformManager(typeof SEED_DATA !== 'undefined' ? SEED_DATA : {});
      }, []);

      // Estados reactivos principales
      const [currentUserId, setCurrentUserId] = useState(manager.currentUserId);
      const [activeTab, setActiveTab] = useState('inicio'); // inicio, reportes, emergencias, actividades, foro, donaciones, admin, perfil
      const [refreshKey, setRefreshKey] = useState(0);

      // Estado del usuario autenticado
      const currentUser = useMemo(() => {
        return manager.users.find(u => u.id === currentUserId) || null;
      }, [currentUserId, refreshKey]);

      const isAdmin = currentUser ? currentUser.canModerate() : false;
      const isExpert = currentUser ? currentUser.role === 'Experto' : false;

      // Calendario de actividades
      const [calendarDate, setCalendarDate] = useState(new Date(2026, 10, 1));
      const [selectedActivityModal, setSelectedActivityModal] = useState(null);
      const [activityModalMode, setActivityModalMode] = useState('view'); // 'view', 'create', 'edit'
      const [activityFormData, setActivityFormData] = useState({
        id: '',
        name: '',
        description: '',
        image: '',
        date: '2026-11-28',
        time: '08:00 AM - 12:00 PM',
        location: 'Cartagena de Indias',
        responsible: 'Dra. Marina Castillo',
        type: 'Limpieza Costera',
        totalSpots: 25,
        requirements: ''
      });

      // Modales de Autenticación
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [login2FAToken, setLogin2FAToken] = useState('');
      const [requires2FAStep, setRequires2FAStep] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regCity, setRegCity] = useState('Cartagena de Indias');
      const [regError, setRegError] = useState('');

      // Modal de Configuración 2FA
      const [show2FAModal, setShow2FAModal] = useState(false);
      const [setup2FAData, setSetup2FAData] = useState(null);
      const [verify2FAInput, setVerify2FAInput] = useState('');
      const [error2FA, setError2FA] = useState('');

      // Modal de Solicitud de Verificación de Experto (RF10)
      const [showVerificationModal, setShowVerificationModal] = useState(false);
      const [verifInstitution, setVerifInstitution] = useState('');
      const [verifSpecialization, setVerifSpecialization] = useState('');
      const [verifBio, setVerifBio] = useState('');
      const [verifFiles, setVerifFiles] = useState([]);
      const [verifError, setVerifError] = useState('');

      // Modal de Moderación de Verificación (Admin RF10)
      const [selectedVerifToReview, setSelectedVerifToReview] = useState(null);
      const [verifReviewNotes, setVerifReviewNotes] = useState('');

      // Modal de Creación de Reporte Ambiental (RF05)
      const [showReportModal, setShowReportModal] = useState(false);
      const [repIncidentType, setRepIncidentType] = useState('plasticos');
      const [repDescription, setRepDescription] = useState('');
      const [repDate, setRepDate] = useState(new Date().toISOString().split('T')[0]);
      const [repLat, setRepLat] = useState(10.3997);
      const [repLng, setRepLng] = useState(-75.5144);
      const [repAddress, setRepAddress] = useState('Bahía de Cartagena, Bolívar');
      const [repPhotos, setRepPhotos] = useState([]);
      const [repPhotoInput, setRepPhotoInput] = useState('');
      const [repError, setRepError] = useState('');
      const [reportFilterTab, setReportFilterTab] = useState('aprobados'); // 'aprobados', 'mis_reportes'

      // Modal de Moderación de Reportes (Admin RF05)
      const [selectedReportToReview, setSelectedReportToReview] = useState(null);
      const [reportReviewNotes, setReportReviewNotes] = useState('');

      // Directorio de Emergencias (RF06)
      const [emergencyCategoryFilter, setEmergencyCategoryFilter] = useState('todas');
      const [emergencySearchQuery, setEmergencySearchQuery] = useState('');
      const [showContactModal, setShowContactModal] = useState(false);
      const [contactFormData, setContactFormData] = useState({
        id: '',
        name: '',
        category: 'lineas_emergencia',
        phone: '',
        email: '',
        website: '',
        location: 'Colombia',
        description: '',
        is24h: true
      });

      // Panel Admin Sub-Tab (RF09)
      const [adminSubTab, setAdminSubTab] = useState('metricas'); // metricas, usuarios, reportes, verificaciones, contactos, actividades, auditoria
      const [userSearchQuery, setUserSearchQuery] = useState('');
      const [userRoleFilter, setUserRoleFilter] = useState('todos');
      const [selectedUserToEdit, setSelectedUserToEdit] = useState(null);
      const [selectedUserRoleChange, setSelectedUserRoleChange] = useState('');

      // Modal de Otorgar Insignia (Admin)
      const [showGrantBadgeModal, setShowGrantBadgeModal] = useState(false);
      const [targetUserIdForBadge, setTargetUserIdForBadge] = useState('');
      const [badgeIdToGrant, setBadgeIdToGrant] = useState('');

      // Campañas de Donación
      const [selectedCampaignToDonate, setSelectedCampaignToDonate] = useState(null);
      const [donationAmount, setDonationAmount] = useState(50000);
      const [donorName, setDonorName] = useState('');

      // Foro
      const [forumCategoryFilter, setForumCategoryFilter] = useState('Todas');
      const [newPostTitle, setNewPostTitle] = useState('');
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostCategory, setNewPostCategory] = useState('Conservación');
      const [showCreatePostModal, setShowCreatePostModal] = useState(false);
      const [replyInputs, setReplyInputs] = useState({});

      // Notificaciones
      const [showNotifDropdown, setShowNotifDropdown] = useState(false);

      // Menú Móvil Responsivo (Hamburguesa)
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Filtros avanzados de Reportes Ambientales
      const [reportCategoryFilter, setReportCategoryFilter] = useState('todas');
      const [reportSearchQuery, setReportSearchQuery] = useState('');

      // Asignación de Insignias desde Panel Administrativo
      const [adminBadgeTargetUser, setAdminBadgeTargetUser] = useState(manager.users[1] ? manager.users[1].id : '');
      const [adminBadgeSelectedId, setAdminBadgeSelectedId] = useState('badge-1');

      // Sincronización en tiempo real entre pestañas, ventanas y dispositivos
      useEffect(() => {
        const handleSync = () => {
          manager.campaigns = manager.db.loadCampaigns();
          manager.users = manager.db.loadUsers();
          manager.badges = manager.db.loadBadges();
          manager.reports = manager.db.loadReports();
          manager.notifications = manager.db.loadNotifications();
          setRefreshKey(k => k + 1);
        };

        window.addEventListener('storage', handleSync);
        window.addEventListener('vida_marina_sync', handleSync);

        return () => {
          window.removeEventListener('storage', handleSync);
          window.removeEventListener('vida_marina_sync', handleSync);
        };
      }, [manager]);

      // Trigger re-render
      const forceRefresh = () => {
        setRefreshKey(k => k + 1);
      };

      // Celebración con confetti
      const triggerCelebration = () => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

      // ==================== ACCIONES DE AUTENTICACIÓN ====================
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');

        const res = await manager.login(loginEmail, loginPassword, login2FAToken || null);
        if (res.requires2FA) {
          setRequires2FAStep(true);
          setLoginError('Se requiere verificación en dos pasos (2FA). Ingrese su código de 6 dígitos.');
          return;
        }

        if (res.success && res.user) {
          setCurrentUserId(res.user.id);
          setShowLoginModal(false);
          setRequires2FAStep(false);
          setLoginEmail('');
          setLoginPassword('');
          setLogin2FAToken('');
          forceRefresh();
        } else {
          setLoginError(res.error || 'Error al iniciar sesión.');
        }
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setRegError('');

        const res = await manager.register({
          name: regName,
          email: regEmail,
          password: regPassword,
          city: regCity
        });

        if (res.success && res.user) {
          setCurrentUserId(res.user.id);
          setShowRegisterModal(false);
          setRegName('');
          setRegEmail('');
          setRegPassword('');
          forceRefresh();
          triggerCelebration();
        } else {
          setRegError(res.error || 'Error al crear la cuenta.');
        }
      };

      const handleLogout = () => {
        manager.logout();
        setCurrentUserId(null);
        setActiveTab('inicio');
        forceRefresh();
      };

      // ==================== CONFIGURACIÓN 2FA ====================
      const handleStart2FASetup = async () => {
        if (!currentUser) return;
        setError2FA('');
        const res = await manager.authService.setup2FA(currentUser.id);
        if (res.success) {
          setSetup2FAData(res);
          setShow2FAModal(true);
        }
      };

      const handleVerifyAndEnable2FA = async () => {
        if (!currentUser || !setup2FAData) return;
        setError2FA('');

        const res = await manager.authService.verifyAndEnable2FA(
          currentUser.id,
          setup2FAData.secret,
          verify2FAInput
        );

        if (res.success) {
          setShow2FAModal(false);
          setVerify2FAInput('');
          setSetup2FAData(null);
          forceRefresh();
          triggerCelebration();
          alert('¡Autenticación de dos factores (2FA) configurada exitosamente!');
        } else {
          setError2FA(res.error || 'Código incorrecto. Vuelva a intentar.');
        }
      };

      // ==================== REPORTES AMBIENTALES (RF05) ====================
      const handleGetGPSLocation = async () => {
        try {
          const loc = await GoogleMapsService.getCurrentLocation();
          setRepLat(loc.latitude);
          setRepLng(loc.longitude);
          const addr = await GoogleMapsService.reverseGeocode(loc.latitude, loc.longitude);
          setRepAddress(addr);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleCreateReportSubmit = async (e) => {
        e.preventDefault();
        setRepError('');

        if (!currentUser) {
          alert('Debe iniciar sesión para realizar un reporte ambiental.');
          setShowLoginModal(true);
          return;
        }

        const res = await manager.reportService.createReport({
          reporterUser: currentUser,
          incidentType: repIncidentType,
          description: repDescription,
          date: repDate,
          latitude: repLat,
          longitude: repLng,
          address: repAddress,
          photos: repPhotos.length > 0 ? repPhotos : ['https://images.unsplash.com/photo-1621451537084-482c73073a0f?auto=format&fit=crop&w=600&q=80']
        });

        if (res.success) {
          setShowReportModal(false);
          setRepDescription('');
          setRepPhotos([]);
          setRepPhotoInput('');
          setReportFilterTab('mis_reportes');
          forceRefresh();
          triggerCelebration();
          alert('✓ Reporte ambiental enviado correctamente. Queda en estado "Pendiente de Revisión" por la coordinación.');
        } else {
          setRepError(res.error || 'Error al enviar reporte.');
        }
      };

      const handleModerateReport = async (approved) => {
        if (!selectedReportToReview || !currentUser) return;
        const res = await manager.reportService.moderateReport({
          reportId: selectedReportToReview.id,
          adminUser: currentUser,
          approved,
          notes: reportReviewNotes
        });

        if (res.success) {
          setSelectedReportToReview(null);
          setReportReviewNotes('');
          forceRefresh();
          alert(approved ? '✓ Reporte APROBADO satisfactoriamente.' : '✕ Reporte RECHAZADO.');
        } else {
          alert(res.error || 'Error al moderar reporte.');
        }
      };

      // ==================== VERIFICACIÓN DE EXPERTOS (RF10) ====================
      const handleSubmitVerification = async (e) => {
        e.preventDefault();
        setVerifError('');

        if (!currentUser) return;

        const docsToAttach = verifFiles.length > 0 ? verifFiles : [
          {
            name: 'Tarjeta_Profesional_o_Certificado_Academico.pdf',
            type: 'application/pdf',
            fileUrl: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
            size: '1.5 MB'
          }
        ];

        const res = await manager.verificationService.submitVerificationRequest({
          user: currentUser,
          institution: verifInstitution,
          specialization: verifSpecialization,
          professionalBio: verifBio,
          documents: docsToAttach
        });

        if (res.success) {
          setShowVerificationModal(false);
          setVerifInstitution('');
          setVerifSpecialization('');
          setVerifBio('');
          setVerifFiles([]);
          forceRefresh();
          alert('✓ Solicitud de verificación radicada exitosamente. La administración revisará tus documentos.');
        } else {
          setVerifError(res.error || 'Error al radicar solicitud.');
        }
      };

      const handleReviewVerification = async (approved) => {
        if (!selectedVerifToReview || !currentUser) return;
        const res = await manager.verificationService.reviewRequest({
          requestId: selectedVerifToReview.id,
          adminUser: currentUser,
          approved,
          feedback: verifReviewNotes
        });

        if (res.success) {
          setSelectedVerifToReview(null);
          setVerifReviewNotes('');
          forceRefresh();
          alert(approved ? '✓ Solicitud APROBADA. Se ha notificado al investigador.' : '✕ Solicitud RECHAZADA.');
        } else {
          alert(res.error || 'Error al revisar verificación.');
        }
      };

      // ==================== CONTACTOS DE EMERGENCIA (RF06) ====================
      const handleSaveContact = async (e) => {
        e.preventDefault();
        if (!currentUser || !currentUser.canManageDirectory()) return;

        if (contactFormData.id) {
          await manager.emergencyService.updateContact({
            adminUser: currentUser,
            id: contactFormData.id,
            data: contactFormData
          });
        } else {
          await manager.emergencyService.addContact({
            adminUser: currentUser,
            ...contactFormData
          });
        }
        setShowContactModal(false);
        forceRefresh();
      };

      const handleDeleteContact = async (id) => {
        if (!confirm('¿Confirma que desea eliminar este contacto de emergencia del directorio?')) return;
        await manager.emergencyService.deleteContact({
          adminUser: currentUser,
          id
        });
        forceRefresh();
      };

      // ==================== RBAC: CAMBIO DE ROL Y USUARIOS (RF09) ====================
      const handleSaveUserRoleChange = () => {
        if (!selectedUserToEdit || !selectedUserRoleChange || !currentUser) return;
        const res = manager.changeUserRole(currentUser, selectedUserToEdit.id, selectedUserRoleChange);
        if (res.success) {
          setSelectedUserToEdit(null);
          setSelectedUserRoleChange('');
          forceRefresh();
          alert('✓ Rol actualizado correctamente.');
        } else {
          alert(res.error || 'Error al cambiar rol.');
        }
      };

      // ==================== ACTIVIDADES ECOLÓGICAS ====================
      const handleEnrollActivity = (actId) => {
        if (!currentUser) {
          alert('Debe iniciar sesión para inscribirse en actividades.');
          setShowLoginModal(true);
          return;
        }

        const res = manager.enrollCurrentInActivity(actId);
        if (res.success) {
          forceRefresh();
          triggerCelebration();
          if (res.newlyUnlockedBadge) {
            alert(`🎉 ¡Felicitaciones! Has desbloqueado la insignia: ${res.newlyUnlockedBadge.name}`);
          } else {
            alert('✓ Inscripción confirmada a la actividad.');
          }
        } else {
          alert(res.error || 'No fue posible completar la inscripción.');
        }
      };

      const handleCancelEnroll = (actId) => {
        manager.cancelEnrollment(actId);
        forceRefresh();
      };

      // ==================== DONACIONES ====================
      const handleExecuteDonation = () => {
        if (!selectedCampaignToDonate) return;
        const numAmount = Number(donationAmount);
        if (!numAmount || numAmount <= 0) {
          alert('Por favor ingresa un monto válido para la donación.');
          return;
        }

        const res = manager.donateToCampaign(
          selectedCampaignToDonate.id,
          numAmount,
          donorName || (currentUser ? currentUser.name : 'Donante Anónimo')
        );

        if (res.success) {
          const campTitle = selectedCampaignToDonate.title;
          const formattedAmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(numAmount);
          setSelectedCampaignToDonate(null);
          // Recargar colecciones para sincronía inmediata
          manager.campaigns = manager.db.loadCampaigns();
          forceRefresh();
          triggerCelebration();
          alert(`💚 ¡Muchas gracias por tu donación de ${formattedAmt}!\n\nEl aporte se ha sumado exitosamente a la campaña "${campTitle}". La cifra y la barra de progreso se han actualizado en tiempo real.`);
        } else {
          alert(res.error || 'Error al procesar la donación.');
        }
      };

      // ==================== FORO ====================
      const handleCreatePostSubmit = (e) => {
        e.preventDefault();
        if (!currentUser) {
          alert('Debe iniciar sesión para publicar en el foro.');
          setShowLoginModal(true);
          return;
        }

        if (newPostCategory === 'Investigación Científica' && !currentUser.canPublishScience()) {
          alert('La categoría "Investigación Científica" está reservada para Investigadores y Expertos acreditados con 2FA.');
          return;
        }

        const res = manager.createPost({
          title: newPostTitle,
          content: newPostContent,
          category: newPostCategory
        });

        if (res) {
          setShowCreatePostModal(false);
          setNewPostTitle('');
          setNewPostContent('');
          forceRefresh();
          triggerCelebration();
        }
      };

                    <label className="text-xs text-slate-300 font-semibold">Lugar o Referencia Costera</label>
                    <input
                      type="text"
                      required
                      value={repAddress}
                      onChange={(e) => setRepAddress(e.target.value)}
                      placeholder="Ej. Playa Blanca, Isla de Barú"
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Fotografías de Evidencia (URLs o Subida)</label>
                    <div className="flex space-x-2 mt-1">
                      <input
                        type="url"
                        placeholder="https://... URL de la imagen"
                        value={repPhotoInput}
                        onChange={(e) => setRepPhotoInput(e.target.value)}
                        className="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          if (repPhotoInput.trim()) {
                            setRepPhotos([...repPhotos, repPhotoInput.trim()]);
                            setRepPhotoInput('');
                          }
                        }}
                        className="px-3 py-2 rounded-xl bg-cyan-500/20 text-cyan-300 text-xs font-bold"
                      >
                        + Agregar
                      </button>
                    </div>
                    {repPhotos.length > 0 && (
                      <div className="flex space-x-2 mt-2 overflow-x-auto pb-1">
                        {repPhotos.map((p, idx) => (
                          <img key={idx} src={p} alt="Evidencia" className="w-14 h-14 rounded-lg object-cover ring-1 ring-cyan-400" />
                        ))}
                      </div>
                    )}
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase shadow-md shadow-cyan-500/20"
                  >
                    Enviar Reporte a Revisión
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal de Moderación de Reportes (Admin RF05) */}
          {selectedReportToReview && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-lg w-full border border-cyan-500/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Inspección y Moderación del Reporte</h3>
                  <button onClick={() => setSelectedReportToReview(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-2 text-xs">
                  <p>Incidente: <strong className="text-white">{selectedReportToReview.getIncidentLabel()}</strong></p>
                  <p>Ubicación: <strong className="text-cyan-300">{selectedReportToReview.address}</strong> (Lat: {selectedReportToReview.latitude}, Lng: {selectedReportToReview.longitude})</p>
                  <p>Reportado por: <strong className="text-white">{selectedReportToReview.reporterName}</strong> ({selectedReportToReview.reporterEmail})</p>
                  <p className="text-slate-300 leading-relaxed">{selectedReportToReview.description}</p>
                </div>

                {selectedReportToReview.photos && selectedReportToReview.photos.length > 0 && (
                  <div className="rounded-xl overflow-hidden max-h-48">
                    <img src={selectedReportToReview.photos[0]} alt="Foto" className="w-full h-full object-cover" />
                  </div>
                )}

                <div>
                  <label className="text-xs text-slate-300 font-semibold">Observaciones de Moderación / Feedback al Usuario</label>
                  <textarea
                    rows="3"
                    value={reportReviewNotes}
                    onChange={(e) => setReportReviewNotes(e.target.value)}
                    placeholder="Indica el motivo de la aprobación o rechazo..."
                    className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                  ></textarea>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button
                    onClick={() => handleModerateReport(false)}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs uppercase"
                  >
                    ✕ Rechazar Reporte
                  </button>
                  <button
                    onClick={() => handleModerateReport(true)}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs uppercase"
                  >
                    ✓ Aprobar para el Mapa
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal de Crear/Editar Contacto de Emergencia (RF06) */}
          {showContactModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-md w-full border border-cyan-500/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">
                    {contactFormData.id ? 'Editar Contacto Institucional' : 'Nuevo Contacto de Emergencia'}
                  </h3>
                  <button onClick={() => setShowContactModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveContact} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Nombre de la Organización</label>
                    <input
                      type="text"
                      required
                      value={contactFormData.name}
                      onChange={(e) => setContactFormData({ ...contactFormData, name: e.target.value })}
                      placeholder="Ej. DIMAR, Guardacostas, INVEMAR"
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Categoría Oficial</label>
                    <select
                      value={contactFormData.category}
                      onChange={(e) => setContactFormData({ ...contactFormData, category: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    >
                      <option value="lineas_emergencia">Líneas de Atención Ambiental</option>
                      <option value="guardia_costera">Guardia Costera y Armada Nacional</option>
                      <option value="autoridades_costeras">Autoridades Ambientales Costeras</option>
                      <option value="centros_rescate">Centros de Rescate de Fauna</option>
                      <option value="ongs">Organizaciones No Gubernamentales</option>
                      <option value="brigadas">Brigadas y Respuesta Rápida</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Número Telefónico (Real)</label>
                    <input
                      type="text"
                      required
                      value={contactFormData.phone}
                      onChange={(e) => setContactFormData({ ...contactFormData, phone: e.target.value })}
                      placeholder="Ej. 146 o +57 (601) 2200490"
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Ubicación / Cobertura</label>
                    <input
                      type="text"
                      required
                      value={contactFormData.location}
                      onChange={(e) => setContactFormData({ ...contactFormData, location: e.target.value })}
                      placeholder="Ej. Cartagena, Santa Marta, Nacional"
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Descripción del Servicio</label>
                    <textarea
                      rows="2"
                      value={contactFormData.description}
                      onChange={(e) => setContactFormData({ ...contactFormData, description: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase"
                  >
                    Guardar Contacto
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal de Cambio de Rol RBAC (RF09) */}
          {selectedUserToEdit && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-sm w-full border border-amber-500/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Modificar Rol de Usuario</h3>
                  <button onClick={() => setSelectedUserToEdit(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="text-xs text-slate-300 space-y-1">
                  <p>Usuario: <strong className="text-white">{selectedUserToEdit.name}</strong></p>
                  <p>Correo: {selectedUserToEdit.email}</p>
                  <p>Rol Actual: <strong className="text-cyan-300">{selectedUserToEdit.role}</strong></p>
                </div>

                <div>
                  <label className="text-xs text-slate-300 font-semibold">Seleccionar Nuevo Rol RBAC:</label>
                  <select
                    value={selectedUserRoleChange}
                    onChange={(e) => setSelectedUserRoleChange(e.target.value)}
                    className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                  >
                    <option value="Ciudadano">🌊 Ciudadano Consciente</option>
                    <option value="Voluntario">🐬 Voluntario Marino</option>
                    <option value="Experto">🔬 Investigador / Experto</option>
                    <option value="Administrador">👑 Administrador General</option>
                  </select>
                </div>

                <button
                  onClick={handleSaveUserRoleChange}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs uppercase"
                >
                  Confirmar Cambio de Rol
                </button>
              </div>
            </div>
          )}

          {/* Modal de Donación */}
          {selectedCampaignToDonate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-md w-full border border-emerald-500/40 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="p-2 rounded-xl bg-emerald-500/20 text-emerald-400">
                      <i className="fa-solid fa-hand-holding-heart text-base"></i>
                    </span>
                    <div>
                      <h3 className="text-lg font-bold text-white">Donar a la Conservación</h3>
                      <p className="text-[10px] text-emerald-400 font-semibold">Fondo Marino ODS 14 • UMB</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedCampaignToDonate(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-emerald-500/20 text-xs space-y-1">
                  <p className="text-slate-400 text-[11px]">Proyecto Seleccionado:</p>
                  <p className="font-bold text-white text-sm">{selectedCampaignToDonate.title}</p>
                  <p className="text-emerald-300 text-[11px]">Organiza: {selectedCampaignToDonate.organizer}</p>
                </div>

                <div>
                  <label className="text-xs text-slate-300 font-semibold block mb-1">Selecciona un monto sugerido (COP):</label>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {[20000, 50000, 100000, 200000].map(amt => (
                      <button
                        key={amt}
                        type="button"
                        onClick={() => setDonationAmount(amt)}
                        className={`py-2 px-2 rounded-xl text-xs font-bold transition text-center ${
                          donationAmount === amt
                            ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30'
                            : 'bg-slate-900 text-slate-300 border border-slate-800 hover:border-emerald-500/40'
                        }`}
                      >
                        ${(amt / 1000)}k COP
                      </button>
                    ))}
                  </div>

                  <div className="mt-2.5">
                    <label className="text-[11px] text-slate-400 block mb-0.5">O ingresa un monto personalizado (COP):</label>
                    <div className="relative">
                      <span className="absolute left-3 top-2.5 text-xs text-emerald-400 font-bold">$</span>
                      <input
                        type="number"
                        min="5000"
                        step="5000"
                        value={donationAmount}
                        onChange={(e) => setDonationAmount(parseInt(e.target.value) || 0)}
                        className="w-full pl-7 pr-3 py-2 rounded-xl bg-slate-900 border border-emerald-500/30 text-xs text-white font-bold"
                      />
                    </div>
                  </div>
                </div>

                <div>
                  <label className="text-xs text-slate-300 font-semibold block mb-1">Medio de Pago:</label>
                  <select className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white">
                    <option value="pse">🏦 PSE (Cuentas Corrientes y de Ahorro Colombia)</option>
                    <option value="nequi">📱 Nequi / Daviplata</option>
                    <option value="bancolombia">💳 Botón Bancolombia</option>
                    <option value="card">💳 Tarjeta de Crédito / Débito (Visa / Mastercard)</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs text-slate-300 font-semibold">Nombre del Donante (opcional)</label>
                  <input
                    type="text"
                    value={donorName}
                    onChange={(e) => setDonorName(e.target.value)}
                    placeholder={currentUser ? currentUser.name : "Tu nombre o Donante Anónimo"}
                    className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                  />
                </div>

                <div className="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/20 text-[11px] text-slate-300 flex items-center space-x-2">
                  <i className="fa-solid fa-leaf text-emerald-400 text-sm"></i>
                  <span>Al donar recibirás +50 XP y la recaudación se actualizará inmediatamente en todas las pantallas.</span>
                </div>

                <button
                  onClick={handleExecuteDonation}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/30 transition flex items-center justify-center space-x-2"
                >
                  <i className="fa-solid fa-lock text-xs"></i>
                  <span>Confirmar Donación ({new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(donationAmount)})</span>
                </button>
              </div>
            </div>
          )}

          {/* Modal de Creación de Publicación en Foro */}
          {showCreatePostModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-lg w-full border border-cyan-500/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Nueva Publicación en el Foro</h3>
                  <button onClick={() => setShowCreatePostModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleCreatePostSubmit} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Categoría</label>
                    <select
                      value={newPostCategory}
                      onChange={(e) => setNewPostCategory(e.target.value)}
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    >
                      <option value="Conservación">Conservación Marina</option>
                      {currentUser && currentUser.canPublishScience() && (
                        <option value="Investigación Científica">🔬 Investigación Científica (Acreditados)</option>
                      )}
                      <option value="Fauna Marina">Protección de Fauna</option>
                      <option value="Limpiezas">Jornadas de Limpieza</option>
                      <option value="Educación">Educación Ambiental</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Título del Tema</label>
                    <input
                      type="text"
                      required
                      value={newPostTitle}
                      onChange={(e) => setNewPostTitle(e.target.value)}
                      placeholder="Título claro y conciso..."
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-300 font-semibold">Contenido</label>
                    <textarea
                      rows="4"
                      required
                      value={newPostContent}
                      onChange={(e) => setNewPostContent(e.target.value)}
                      placeholder="Escribe tu aporte, investigación o pregunta ecológica..."
                      className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs uppercase"
                  >
                    Publicar
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal de Otorgar Insignia (Admin) */}
          {showGrantBadgeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="ocean-glass rounded-3xl p-6 md:p-8 max-w-sm w-full border border-amber-500/40 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white flex items-center space-x-2">
                    <span>🏆</span>
                    <span>Otorgar Insignia Oficial</span>
                  </h3>
                  <button onClick={() => setShowGrantBadgeModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {(() => {
                  const target = manager.users.find(u => u.id === targetUserIdForBadge);
                  if (!target) return null;
                  return (
                    <div className="p-3 rounded-xl bg-slate-900 border border-slate-800 text-xs flex items-center space-x-2.5">
                      <img src={target.avatar} alt={target.name} className="w-8 h-8 rounded-lg object-cover ring-1 ring-amber-400" />
                      <div>
                        <p className="font-bold text-white">{target.name}</p>
                        <p className="text-[10px] text-slate-400">Rol: {target.role} • Nivel {target.level}</p>
                      </div>
                    </div>
                  );
                })()}

                <div>
                  <label className="text-xs text-slate-300 font-semibold">Seleccionar Insignia:</label>
                  <select
                    value={badgeIdToGrant}
                    onChange={(e) => setBadgeIdToGrant(e.target.value)}
                    className="w-full mt-1 px-3 py-2 rounded-xl bg-slate-900 border border-cyan-500/30 text-xs text-white"
                  >
                    {manager.badges.map(b => (
                      <option key={b.id} value={b.id}>
                        {b.icon} {b.name} (+150 XP)
                      </option>
                    ))}
                  </select>
                </div>

                <button
                  onClick={() => {
                    const res = manager.grantBadge(currentUser, targetUserIdForBadge, badgeIdToGrant);
                    if (res.success) {
                      setShowGrantBadgeModal(false);
                      forceRefresh();
                      triggerCelebration();
                      alert('✓ Insignia otorgada exitosamente. Se ha notificado al usuario y sumado +150 XP.');
                    } else {
                      alert(res.error || 'Error al otorgar insignia.');
                    }
                  }}
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-bold text-xs uppercase shadow-md shadow-amber-500/20"
                >
                  Conceder Reconocimiento
                </button>
              </div>
            </div>
          )}

          {/* ==================== FOOTER ==================== */}
          <footer className="mt-12 border-t border-cyan-500/20 bg-slate-950/80 text-xs text-slate-400 py-8">
            <div className="container mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <img src={APP_ASSETS.logo} alt="Logo UMB" className="w-8 h-8 rounded-lg object-cover ring-1 ring-cyan-400" />
                <div>
                  <p className="font-bold text-white">Vida Marina – ODS 14: Vida Submarina</p>
                  <p className="text-[10px] text-slate-500">Universidad Manuela Beltrán • Sprints 1, 2 y 3 Integrados</p>
                </div>
              </div>
              <div className="flex items-center space-x-4 text-[11px]">
                <button onClick={() => setActiveTab('emergencias')} className="text-red-400 hover:underline">
                  🚨 Emergencias Marinas 146
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab('reportes')} className="text-cyan-400 hover:underline">
                  Reportes Ambientales
                </button>
                <span>•</span>
                <button onClick={() => setActiveTab('donaciones')} className="text-emerald-400 hover:underline">
                  Donaciones & Fondo Marino
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Renderizar la aplicación React 18 en el DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
